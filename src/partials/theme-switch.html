<div class="theme-switch" role="group" aria-label="Design version">
  <span class="theme-switch__label">Design</span>
  <button type="button" class="theme-switch__btn" data-set-theme="dark" aria-pressed="false" title="Premium dark">{{icon:moon}}<span>Dark</span></button>
  <button type="button" class="theme-switch__btn" data-set-theme="light" aria-pressed="false" title="Light &amp; modern">{{icon:sun}}<span>Light</span></button>
  <button type="button" class="theme-switch__btn" data-set-theme="playful" aria-pressed="false" title="Warm &amp; playful">{{icon:palette}}<span>Playful</span></button>
</div>
