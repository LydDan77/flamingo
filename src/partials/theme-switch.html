<div class="theme-switch" id="theme-switch">
  <button type="button" class="theme-switch__trigger" aria-haspopup="true" aria-expanded="false" aria-controls="theme-switch-menu" aria-label="Choose a design version" title="Choose a design version">
    <span class="theme-switch__swatch theme-switch__swatch--dark" data-theme-swatch aria-hidden="true"></span>
    <span class="theme-switch__label">Design</span>
    <span class="theme-switch__current" data-theme-current>Dark</span>
    {{icon:chevron-down theme-switch__caret}}
  </button>
  <div class="theme-switch__menu" id="theme-switch-menu" role="group" aria-label="Design version" hidden>
    <p class="theme-switch__heading">Collection One</p>
    <button type="button" class="theme-switch__item" role="menuitemradio" aria-checked="false" data-set-theme="dark" data-theme-name="Dark"><span class="theme-switch__swatch theme-switch__swatch--dark" aria-hidden="true"></span><span><b>Dark</b><small>Biohacker &amp; athlete</small></span>{{icon:check theme-switch__check}}</button>
    <button type="button" class="theme-switch__item" role="menuitemradio" aria-checked="false" data-set-theme="light" data-theme-name="Light"><span class="theme-switch__swatch theme-switch__swatch--light" aria-hidden="true"></span><span><b>Light</b><small>Clean &amp; clinical</small></span>{{icon:check theme-switch__check}}</button>
    <button type="button" class="theme-switch__item" role="menuitemradio" aria-checked="false" data-set-theme="warm" data-theme-name="Warm"><span class="theme-switch__swatch theme-switch__swatch--warm" aria-hidden="true"></span><span><b>Warm</b><small>Warm, clean &amp; easy to read</small></span>{{icon:check theme-switch__check}}</button>
    <button type="button" class="theme-switch__item" role="menuitemradio" aria-checked="false" data-set-theme="bright" data-theme-name="Bright"><span class="theme-switch__swatch theme-switch__swatch--bright" aria-hidden="true"></span><span><b>Bright</b><small>Bold &amp; eccentric</small></span>{{icon:check theme-switch__check}}</button>
    <button type="button" class="theme-switch__item" role="menuitemradio" aria-checked="false" data-set-theme="elite" data-theme-name="Elite"><span class="theme-switch__swatch theme-switch__swatch--elite" aria-hidden="true"></span><span><b>Elite</b><small>Premium, for high-end clients</small></span>{{icon:check theme-switch__check}}</button>
    <p class="theme-switch__heading">Collection Two</p>
    <button type="button" class="theme-switch__item" role="menuitemradio" aria-checked="false" data-set-theme="atelier" data-theme-name="Atelier"><span class="theme-switch__swatch theme-switch__swatch--atelier" aria-hidden="true"></span><span><b>Atelier</b><small>Editorial luxury</small></span>{{icon:check theme-switch__check}}</button>
    <button type="button" class="theme-switch__item" role="menuitemradio" aria-checked="false" data-set-theme="obsidian" data-theme-name="Obsidian"><span class="theme-switch__swatch theme-switch__swatch--obsidian" aria-hidden="true"></span><span><b>Obsidian</b><small>Glass &amp; depth</small></span>{{icon:check theme-switch__check}}</button>
    <button type="button" class="theme-switch__item" role="menuitemradio" aria-checked="false" data-set-theme="sanctuary" data-theme-name="Sanctuary"><span class="theme-switch__swatch theme-switch__swatch--sanctuary" aria-hidden="true"></span><span><b>Sanctuary</b><small>Botanical calm</small></span>{{icon:check theme-switch__check}}</button>
    <button type="button" class="theme-switch__item" role="menuitemradio" aria-checked="false" data-set-theme="monolith" data-theme-name="Monolith"><span class="theme-switch__swatch theme-switch__swatch--monolith" aria-hidden="true"></span><span><b>Monolith</b><small>Swiss precision</small></span>{{icon:check theme-switch__check}}</button>
    <button type="button" class="theme-switch__item" role="menuitemradio" aria-checked="false" data-set-theme="aurora" data-theme-name="Aurora"><span class="theme-switch__swatch theme-switch__swatch--aurora" aria-hidden="true"></span><span><b>Aurora</b><small>Luminous</small></span>{{icon:check theme-switch__check}}</button>
    <div class="theme-switch__divider" role="separator"></div>
    <p class="theme-switch__heading">For partners</p>
    <button type="button" class="theme-switch__item theme-switch__item--partner" role="switch" aria-checked="false" data-partner-toggle><span class="theme-switch__glyph">{{icon:layers}}</span><span><b>Partner view</b><small>Numbered pins and stack links on this site</small></span>{{icon:check theme-switch__check}}</button>
    <a class="theme-switch__item" href="partner-overview.html" rel="nofollow"><span class="theme-switch__glyph">{{icon:book-open}}</span><span><b>Partner overview</b><small>Buyer overview &amp; tech / marketing stack</small></span>{{icon:arrow-up-right theme-switch__go}}</a>
  </div>
</div>
