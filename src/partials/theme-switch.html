<div class="theme-switch" role="group" aria-label="Design version">
  <span class="theme-switch__label">Design</span>
  <button type="button" class="theme-switch__btn" data-set-theme="dark" aria-pressed="false" title="Dark · biohacker &amp; athlete">{{icon:moon}}<span>Dark</span></button>
  <button type="button" class="theme-switch__btn" data-set-theme="light" aria-pressed="false" title="Light · clean &amp; clinical">{{icon:sun}}<span>Light</span></button>
  <button type="button" class="theme-switch__btn" data-set-theme="warm" aria-pressed="false" title="Warm · clean &amp; easy to read">{{icon:heart}}<span>Warm</span></button>
  <button type="button" class="theme-switch__btn" data-set-theme="bright" aria-pressed="false" title="Bright · bold &amp; eccentric">{{icon:palette}}<span>Bright</span></button>
  <button type="button" class="theme-switch__btn" data-set-theme="elite" aria-pressed="false" title="Elite · premium">{{icon:award}}<span>Elite</span></button>
</div>
