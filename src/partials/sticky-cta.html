<!-- Phone-only action bar: book + call, pinned to the bottom once the page has scrolled past the hero (CSS scroll-driven animation; browsers without it show the bar immediately). -->
<div class="sticky-cta" aria-label="Quick actions">
  <a class="btn btn--primary" href="{{site.bookUrl}}">{{icon:calendar-check}} {{site.bookLabel}}</a>
  <a class="btn btn--secondary" href="{{site.phoneTel}}" aria-label="Call {{site.phone}}">{{icon:phone}}<span>Call</span></a>
</div>
